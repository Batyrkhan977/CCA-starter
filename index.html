<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Someone's Cookie Clicker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">
        <h1>🍪 Someone's Cookie Clicker</h1>

        <p class="subtitle">Click the cookie and collect as many cookies as you can!</p>

        <h2>
            Cookies:
            <span id="score">0</span>
        </h2>

        <button id="cookieButton" class="cookie-button">
            🍪
        </button>

        <p id="message">Start clicking!</p>

        <button id="resetButton" class="reset-button">
            Reset Game
        </button>
    </main>

    <script src="script.js"></script>

</body>
</html>
